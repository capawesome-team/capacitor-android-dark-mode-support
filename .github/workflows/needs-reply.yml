name: Close old issues that need reply

on:
  schedule:
    - cron: '0 0 * * *'

jobs:
  needs-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Close old issues that need reply
        uses: dwieeb/needs-reply@71e8d5144caa0d4a1e292348bfafa3866d08c855 # v2.0.0

        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-label: 'needs: reply'
